<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شخصيات العهد القديم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#050816,#0d1b2a,#1b263b);
min-height:100vh;
color:white;
overflow-x:hidden;
}

header{
padding:30px 20px;
text-align:center;
}

.top-bar{
display:flex;
justify-content:flex-end;
margin-bottom:25px;
}

.church{
font-size:20px;
font-weight:900;
color:#ffd166;
background:rgba(255,255,255,.08);
padding:12px 20px;
border-radius:15px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.15);
}

h1{
font-size:clamp(38px,6vw,75px);
font-weight:900;
margin:10px 0;
background:linear-gradient(90deg,#ffffff,#ffd166,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
margin-bottom:20px;
font-size:18px;
opacity:.85;
}

.search-box{
width:90%;
max-width:700px;
margin:20px auto 40px;
}

.search-box input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:15px;
font-size:18px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
color:white;
}

.container{
width:95%;
max-width:1500px;
margin:auto;
padding-bottom:50px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:18px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:18px;
padding:20px;
cursor:pointer;
transition:.3s;
text-align:center;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 25px rgba(255,209,102,.3);
border-color:#ffd166;
}

.card h3{
font-size:20px;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.modal-content{
width:100%;
max-width:500px;
background:#0f172a;
border-radius:20px;
padding:30px;
text-align:center;
border:1px solid rgba(255,255,255,.15);
}

.modal-content h2{
font-size:32px;
margin-bottom:20px;
}

.download-btn{
display:inline-block;
padding:14px 30px;
background:#ffd166;
color:black;
text-decoration:none;
font-weight:900;
border-radius:10px;
margin-top:15px;
}

.close-btn{
margin-top:20px;
color:#ff6b6b;
cursor:pointer;
}

</style>
</head>
<body>

<header>

<div class="top-bar">
<div class="church">اجتماع إعدادي بكنيسة الإخوة بعاصم</div>
</div>

<h1>شخصيات العهد القديم كاملاً</h1>

<div class="subtitle">اختر الشخصية لتحميل ملف الـ PDF</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="ابحث عن شخصية...">
</div>

</header>

<div class="container">
<div class="grid" id="cards"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<h2 id="modalTitle"></h2>

<a id="downloadBtn" class="download-btn" download>
تحميل الملف PDF
</a>

<div class="close-btn" onclick="closeModal()">إغلاق</div>
</div>
</div>

<script>

/* CHARACTERS UPDATED */
const characters = [
"شخصية آدم",
"شخصية حواء",
"شخصية قايين",
"شخصية هابيل",
"شخصية شيث",
"شخصية أخنوخ",
"شخصية متوشالح",
"شخصية نوح",
"شخصية إبراهيم",
"شخصية سارة",
"شخصية لوط",
"شخصية إسماعيل",
"شخصية إسحاق",
"شخصية رفقة",
"شخصية عيسو",
"شخصية يعقوب",
"شخصية راحيل",
"شخصية ليئة",
"شخصية يوسف الصديق",
"شخصية موسى النبي",
"شخصية هارون",
"شخصية مريم",
"شخصية بلعام",
"شخصية يشوع بن نون",
"شخصية راحاب",
"شخصية دبورة",
"شخصية جدعون",
"شخصية شمشون",
"شخصية راعوث",
"شخصية عالي الكاهن",
"شخصية صموئيل النبي",
"شخصية شاول الملك",
"شخصية يوناثان",
"شخصية داود الملك",
"شخصية جليات",
"شخصية بثشبع",
"شخصية أبشالوم",
"شخصية سليمان الحكيم",
"شخصية يربعام",
"شخصية رحبعام",
"شخصية آخاب الملك",
"شخصية إيزابل",
"شخصية إيليا النبي",
"شخصية أليشع النبي",
"شخصية حزقيا الملك",
"شخصية يوشيا الملك",
"شخصية إشعياء النبي",
"شخصية إرميا النبي",
"شخصية حزقيال النبي",
"شخصية دانيال النبي",
"شخصية يونان النبي",
"شخصية هوشع، عاموس، ميخا",
"شخصية الملك كورش",
"شخصية زربابل",
"شخصية عزرا الكاتب",
"شخصية نحميا",
"شخصية أستير الملكة",
"شخصية ملاخي النبي"
];

const cards = document.getElementById("cards");

/* NORMALIZE SEARCH */
function normalize(text){
return text
.toLowerCase()
.replace(/[أإآا]/g,"ا")
.replace(/ة/g,"ه")
.replace(/ى/g,"ي")
.replace(/ؤ/g,"و")
.replace(/ئ/g,"ي")
.replace(/ـ/g,"")
.replace(/[\u064B-\u065F]/g,"");
}

/* RENDER */
function render(list){
cards.innerHTML="";
list.forEach(name=>{
const div=document.createElement("div");
div.className="card";
div.innerHTML=`<h3>${name}</h3>`;
div.onclick=()=>openModal(name);
cards.appendChild(div);
});
}

render(characters);

/* MODAL */
function openModal(name){
document.getElementById("modal").style.display="flex";
document.getElementById("modalTitle").innerText=name;
document.getElementById("downloadBtn").href=encodeURIComponent(name)+".pdf";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",function(){
const val=normalize(this.value);
const filtered=characters.filter(c=>normalize(c).includes(val));
render(filtered);
});

window.onclick=function(e){
if(e.target.id==="modal") closeModal();
}

</script>

</body>
</html>

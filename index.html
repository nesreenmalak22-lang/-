<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شخصيات العهد القديم - Ultra Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

:root{
--gold:#ffd166;
--glass:rgba(255,255,255,.08);
--border:rgba(255,255,255,.15);
}

body{
background:
radial-gradient(circle at top,#132238,#050816),
linear-gradient(135deg,#050816,#09111f,#101c30);
color:white;
min-height:100vh;
overflow-x:hidden;
}

/* Scroll */

::-webkit-scrollbar{
width:10px;
}

::-webkit-scrollbar-track{
background:#08101d;
}

::-webkit-scrollbar-thumb{
background:var(--gold);
border-radius:20px;
}

/* HEADER */

header{
padding:30px;
position:relative;
text-align:center;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:35px;
flex-wrap:wrap;
}

.church{
padding:12px 20px;
background:var(--glass);
backdrop-filter:blur(15px);
border:1px solid var(--border);
border-radius:15px;
font-weight:800;
color:var(--gold);
}

.counter{
padding:12px 20px;
background:var(--glass);
backdrop-filter:blur(15px);
border:1px solid var(--border);
border-radius:15px;
font-weight:700;
}

.hero{
max-width:1000px;
margin:auto;
}

.hero h1{
font-size:clamp(40px,6vw,85px);
font-weight:900;

background:
linear-gradient(
90deg,
#fff,
#ffd166,
#fff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

margin-bottom:15px;
}

.hero p{
opacity:.8;
font-size:18px;
line-height:1.8;
}

/* SEARCH */

.search-area{
max-width:850px;
margin:35px auto;
position:relative;
}

.search{
width:100%;
padding:18px 20px;
border:none;
outline:none;
border-radius:18px;
background:var(--glass);
backdrop-filter:blur(15px);
color:white;
font-size:18px;
border:1px solid var(--border);
}

.search::placeholder{
color:#ccc;
}

/* CATEGORY FILTER */

.filters{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin:20px 0 40px;
}

.filter-btn{
padding:10px 18px;
border-radius:999px;
background:var(--glass);
border:1px solid var(--border);
cursor:pointer;
transition:.3s;
}

.filter-btn:hover{
background:rgba(255,209,102,.15);
}

/* GRID */

.container{
width:95%;
max-width:1600px;
margin:auto;
padding-bottom:60px;
}

.grid{
display:grid;
grid-template-columns:
repeat(
auto-fill,
minmax(240px,1fr)
);
gap:20px;
}

.card{

background:var(--glass);
border:1px solid var(--border);
backdrop-filter:blur(15px);

border-radius:22px;

padding:25px;

cursor:pointer;

transition:.35s;

position:relative;

overflow:hidden;

}

.card::before{

content:"";

position:absolute;

width:250px;
height:250px;

background:
radial-gradient(
circle,
rgba(255,209,102,.18),
transparent 70%
);

top:-100px;
left:-100px;

opacity:0;

transition:.4s;

}

.card:hover::before{
opacity:1;
}

.card:hover{
transform:
translateY(-8px)
scale(1.02);

border-color:var(--gold);

box-shadow:
0 0 30px rgba(255,209,102,.15);
}

.card-icon{
font-size:40px;
margin-bottom:15px;
}

.card h3{
font-size:22px;
font-weight:800;
margin-bottom:8px;
}

.card p{
opacity:.7;
font-size:14px;
}

/* MODAL */

.modal{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.88);

display:none;

justify-content:center;
align-items:center;

z-index:9999;

padding:20px;

}

.modal-content{

width:100%;
max-width:650px;

background:#0f172a;

border-radius:25px;

padding:35px;

text-align:center;

border:1px solid var(--border);

animation:show .35s ease;

}

@keyframes show{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.modal-content h2{
font-size:36px;
margin-bottom:15px;
}

.modal-content p{
opacity:.8;
line-height:1.9;
margin-bottom:20px;
}

.download-btn{

display:inline-block;

padding:16px 35px;

background:var(--gold);

color:#000;

text-decoration:none;

font-weight:900;

border-radius:14px;

transition:.3s;

}

.download-btn:hover{
transform:scale(1.05);
}

.close-btn{
margin-top:20px;
cursor:pointer;
color:#ff8585;
font-size:18px;
}

.alert{
margin-top:15px;
padding:12px;
border-radius:12px;
background:#d62828;
display:none;
}

footer{

padding:40px;

text-align:center;

opacity:.7;

font-size:14px;

}

</style>
</head>
<body>

<header>

<div class="topbar">

<div class="church">
اجتماع إعدادي بكنيسة الإخوة بعاصم
</div>

<div class="counter" id="counter">
62 شخصية
</div>

</div>

<div class="hero">

<h1>
شخصيات العهد القديم كاملاً
</h1>

<p>
موسوعة شخصيات العهد القديم مع ملفات PDF جاهزة للتحميل
</p>

</div>

<div class="search-area">

<input
type="text"
class="search"
id="searchInput"
placeholder="ابحث عن أي شخصية..."
>

</div>

<div class="filters">

<div class="filter-btn">الكل</div>
<div class="filter-btn">أنبياء</div>
<div class="filter-btn">ملوك</div>
<div class="filter-btn">نساء</div>

</div>

</header>

<div class="container">

<div class="grid" id="cardsContainer">

<!-- cards -->

</div>

</div>
<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<h2 id="personName"></h2>

<p>
اضغط على الزر التالي لتحميل الملف الخاص بالشخصية
</p>

<a
id="downloadLink"
class="download-btn"
download
>
تحميل ملف PDF
</a>

<div class="alert" id="alertBox">
❌ الملف غير موجود
</div>

<div
class="close-btn"
onclick="closeModal()"
>
إغلاق
</div>

</div>

</div>

<footer>

جميع الحقوق محفوظة © اجتماع إعدادي بكنيسة الإخوة بعاصم

</footer>

<script>

/* الشخصيات */

const characters = [

"شخصية آدم",
"شخصية حواء",
"شخصية قايين",
"شخصية هابيل",
"شخصية شيث",
"شخصية أخنوخ",
"شخصية متوشالح",
"شخصية نوح",
"شخصية إبراهيم",
"شخصية سارة",
"شخصية لوط",
"شخصية إسماعيل",
"شخصية إسحاق",
"شخصية رفقة",
"شخصية عيسو",
"شخصية يعقوب",
"شخصية راحيل",
"شخصية ليئة",
"شخصية يوسف الصديق",
"شخصية موسى النبي",
"شخصية هارون",
"شخصية مريم",
"شخصية بلعام",
"شخصية يشوع بن نون",
"شخصية راحاب",
"شخصية دبورة",
"شخصية جدعون",
"شخصية شمشون",
"شخصية راعوث",
"شخصية عالي الكاهن",
"شخصية صموئيل النبي",
"شخصية شاول الملك",
"شخصية يوناثان",
"شخصية داود الملك",
"شخصية جليات",
"شخصية بثشبع",
"شخصية أبشالوم",
"شخصية سليمان الحكيم",
"شخصية يربعام",
"شخصية رحبعام",
"شخصية آخاب الملك",
"شخصية إيزابل",
"شخصية إيليا النبي",
"شخصية أليشع النبي",
"شخصية حزقيا الملك",
"شخصية يوشيا الملك",
"شخصية إشعياء النبي",
"شخصية إرميا النبي",
"شخصية حزقيال النبي",
"شخصية دانيال النبي",
"شخصية يونان النبي",
"شخصية هوشع،عاموس،ميخا",
"شخصية الملك كورش",
"شخصية زربابل",
"شخصية عزرا الكاتب",
"شخصية نحميا",
"شخصية أستير الملكة",
"شخصية ملاخي النبي",
"شخصية مردخاي",
"شخصية يهوشافاط الملك",
"شخصية نعمي",
"شخصية ملكي صادق"

];

let selectedCharacter = "";

/* العناصر */

const cardsContainer =
document.getElementById("cardsContainer");

const modal =
document.getElementById("modal");

const personName =
document.getElementById("personName");

const downloadLink =
document.getElementById("downloadLink");

const alertBox =
document.getElementById("alertBox");

/* تطبيع البحث */

function normalizeArabic(text){

return text

.toLowerCase()

.replace(/[أإآا]/g,"ا")

.replace(/ة/g,"ه")

.replace(/ى/g,"ي")

.replace(/ؤ/g,"و")

.replace(/ئ/g,"ي")

.replace(/ـ/g,"")

.replace(/[\u064B-\u065F]/g,"");

}

/* إنشاء الكروت */

function renderCards(list){

cardsContainer.innerHTML = "";

list.forEach(name=>{

const card =
document.createElement("div");

card.className = "card";

card.innerHTML = `

<div class="card-icon">
📖
</div>

<h3>${name}</h3>

<p>
اضغط لعرض الملف
</p>

`;

card.onclick = ()=>{

openModal(name);

};

cardsContainer.appendChild(card);

});

}

renderCards(characters);
/* فتح النافذة */

function openModal(name){

selectedCharacter = name;

personName.innerText = name;

alertBox.style.display = "none";

downloadLink.href =
encodeURIComponent(name)+".pdf";

modal.style.display = "flex";

}

/* إغلاق النافذة */

function closeModal(){

modal.style.display = "none";

}

/* إغلاق عند الضغط بالخارج */

window.onclick = function(e){

if(e.target === modal){

closeModal();

}

}

/* التحقق من الملف قبل التحميل */

downloadLink.addEventListener(

"click",

function(e){

e.preventDefault();

const fileName =
encodeURIComponent(selectedCharacter)+".pdf";

fetch(fileName)

.then(response=>{

if(response.ok){

window.location.href =
fileName;

}else{

alertBox.style.display =
"block";

}

})

.catch(()=>{

alertBox.style.display =
"block";

});

}

);

/* البحث الذكي */

document
.getElementById("searchInput")

.addEventListener(

"input",

function(){

const value =
normalizeArabic(this.value);

const filtered =
characters.filter(item=>

normalizeArabic(item)

.includes(value)

);

renderCards(filtered);

}

);

/* تأثير ظهور الكروت */

const observer =
new IntersectionObserver(

entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.style.opacity="1";

entry.target.style.transform=
"translateY(0)";

}

});

},

{
threshold:0.1
}

);

setTimeout(()=>{

document

.querySelectorAll(".card")

.forEach(card=>{

card.style.opacity="0";

card.style.transform=
"translateY(30px)";

card.style.transition=
".5s";

observer.observe(card);

});

},500);

/* عداد الشخصيات */

document
.getElementById("counter")
.innerText =
characters.length +
" شخصية";

/* اختصار ESC */

document.addEventListener(

"keydown",

function(e){

if(
e.key==="Escape"
){

closeModal();

}

}

);

</script>

</body>
</html>
